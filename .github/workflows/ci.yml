name: tinybv-rs

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build and Test
    strategy:
      matrix:
        platform: [macos-15, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Rustup
        run: rustup update stable && rustup default stable
      - name: Build
        run: cargo build --verbose
      - name: Test (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: RUSTFLAGS='-C target-feature=+avx2' cargo test --verbose -- --show-output
      - name: Test
        if: matrix.platform != 'ubuntu-latest'
        run: cargo test --verbose -- --show-output
